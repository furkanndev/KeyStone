name: Build & Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: KeyStone-windows-x64.exe
          - os: macos-latest            # Apple silicon
            asset: KeyStone-macos-arm64.zip
          - os: ubuntu-22.04            # oldest glibc we support -> runs on newer distros
            asset: keystone-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux GUI dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libgirepository1.0-dev
          python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with: { python-version: "3.12" }

      - name: Install
        run: |
          python -m pip install --upgrade pip   # Ubuntu 22.04's venv ships pip 22
          python -m pip install -e ".[gui,dev]"

      - name: Build
        run: python tools/build.py

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/KeyStone.exe "out/${{ matrix.asset }}" ;;
            macOS)   (cd dist && ditto -c -k --keepParent KeyStone.app "../out/${{ matrix.asset }}") ;;
            Linux)   cp dist/keystone "out/${{ matrix.asset }}" && chmod +x "out/${{ matrix.asset }}" ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  release:
    needs: [test, build]
    # One platform failing to build must not hold back the others.
    if: ${{ !cancelled() && needs.test.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
